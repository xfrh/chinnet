<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="http://apps.bdimg.com/libs/jquery/1.9.1/jquery.min.js"></script>
</head>
<body>
    <div class="panel panel-default">
        <div class="panel-heading">说明</div>
        <table class="table" id="dataTable">
            <th>标题</th>
            <th>说明</th>
            <tr data-name="标题1" data-type="1"><td>标题1</td><td>第一个标题</td></tr>
            <tr data-name="标题2" data-type="2"><td>标题2</td><td>第二个标题</td></tr>
            <tr data-name="标题3" data-type="3"><td>标题3</td><td>第三个标题</td></tr>
            <tr data-name="标题4" data-type="4"><td>标题4</td><td>第四个标题</td></tr>
        </table>
    </div>
    <div style="text-align: center"><button type="button" class="btn-info js-wechat-pay" data-type=""onclick="Pay()" >你点击标题（）</button> </div>
    <!--</div>-->

    <script type="text/javascript">

        //微信内部调用
       document.addEventListener('WeixinJSBridgeReady', function onBridgeReady() {
           $("#dataTable tr").click(function () {

               debugger
               var name = $(this).attr("data-name");
               var type = $(this).attr("data-type");

               $("#dataTable tr").css("background-color", "white");
               $(this).css("background-color", "red");

             
               $(".js-wechat-pay").html("您点击了：" + name);
               $(".js-wechat-pay").attr("data-type", type);

           });
       });


        //非微信的测试
     //   $(document).ready(function () {

     //    $("#dataTable tr").click(function () {

     //        debugger
     //        var name = $(this).attr("data-name");
     //        var type = $(this).attr("data-type");

     //        $(".js-wechat-pay").html("您点击了：" + name);
     //        $(".js-wechat-pay").attr("data-type",type);
     //    });
     //})

        //发起支付请求
        function Pay() {
            debugger
            var type = $(".js-wechat-pay").attr("data-type");

            $.ajax({
                type: "GET",
                url: "?type=" + type,
                dataType: "json",
                success: function (data) {

                    if (data.status == 'success') {
                        util.pay({
                            orderFee: data.data.fee,
                            payMethod: 'wechat',
                            orderTitle: '充值' + data.data.fee + '元',
                            orderTid: data.data.ordertid,
                            module: 'fy_tujia',
                            success: function (result) {
                                alert('支付成功');

                            },
                            fail: function (result) {
                                alert('fail : ' + result.message);
                            },
                            complete: function (result) {
                                location.reload();
                            }
                        });
                    }
                }
            });
        }

    </script>


</body>
</html>
